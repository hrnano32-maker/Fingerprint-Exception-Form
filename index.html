<body><div class="wrap"><div class="card"><div class="langbar"><button id="thBtn" class="active" type="button" onclick="setLang('th')">ไทย</button><button id="mmBtn" type="button" onclick="setLang('mm')">မြန်မာ</button></div><h1 id="pageTitle">แจ้งสแกนนิ้วไม่ติดและอื่นๆ</h1><div id="pageSub" class="sub">กรอกข้อมูลและแนบรูปหลักฐานการลงเวลา</div>

let adminMode=false, centralRecords=[];
async function loadCentral(){if(!window.FPDB)return;try{const x=FPDB,q= x.query(x.collection(x.db,'fingerprintExceptions'),x.orderBy('createdAt','desc'));const s=await x.getDocs(q);centralRecords=s.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){console.error(e);records.innerHTML='<div class="hint">ไม่สามารถโหลดรายการได้ กรุณาลองใหม่อีกครั้ง</div>'}}
function openManage(){const code=prompt('กรอกรหัสสำหรับจัดการรายการ');if(code===null)return;if(code!=='303647'){alert('รหัสไม่ถูกต้อง');return}adminMode=true;render()}
