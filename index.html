<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>แจ้งสแกนนิ้วไม่ติด</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:Arial,"Noto Sans Thai",sans-serif;color:#17202a}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 5px 24px #00000012}h1{font-size:25px;margin:0 0 4px}.sub{color:#667280;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:15px}.full{grid-column:1/-1}label{font-weight:700;display:block;margin-bottom:7px}input,textarea{width:100%;border:1px solid #d5d9df;border-radius:12px;padding:13px 14px;font-size:16px;background:#fff}input:focus,textarea:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.scan{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scan input{display:none}.scan label{border:1px solid #d5d9df;border-radius:12px;padding:14px;text-align:center;cursor:pointer}.scan input:checked+label{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}.upload{border:2px dashed #cbd5e1;border-radius:14px;padding:18px;text-align:center}.preview{max-width:100%;max-height:260px;border-radius:12px;margin-top:12px;display:none}.submit{width:100%;border:0;border-radius:13px;padding:16px;background:#2563eb;color:white;font-size:18px;font-weight:700;cursor:pointer}.hint{font-size:13px;color:#667280;margin-top:6px}.ok{display:none;margin-top:14px;padding:14px;background:#ecfdf5;border-radius:12px;color:#166534;font-weight:700}.records{margin-top:18px}.record{padding:12px 0;border-bottom:1px solid #eee}.manage{float:right;border:1px solid #d5d9df;background:#fff;border-radius:10px;padding:8px 12px}.admin-actions{margin-top:8px;display:flex;gap:8px}.admin-actions button{border:1px solid #d5d9df;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.admin-actions .del{color:#b91c1c;border-color:#fecaca}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.scan{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:18px}}</style></head>
<body><div class="wrap"><div class="card"><h1>แบบฟอร์มแจ้งสแกนนิ้วไม่ติด</h1><div class="sub">กรอกข้อมูลและแนบรูปหลักฐานการลงเวลา</div>
<form id="f"><div class="grid">
<div class="field"><label>1. รหัสพนักงาน</label><input id="eid" list="ids" inputmode="numeric" placeholder="กรอกรหัสพนักงาน" required><datalist id="ids"></datalist></div>
<div class="field"><label>2. ชื่อ–นามสกุลพนักงาน</label><input id="ename" list="names" placeholder="ค้นหาหรือเลือกชื่อ" required><datalist id="names"></datalist></div>
<div class="field"><label>3. วันที่</label><input id="date" type="date" required></div>
<div class="field full"><label>4. ประเภทการสแกน</label><div class="scan"><div><input id="am" name="scan" type="radio" value="เข้างานก่อน 08:00" required><label for="am">🌅 เข้างานก่อน 08:00</label></div><div><input id="pm" name="scan" type="radio" value="เลิกงาน 17:00"><label for="pm">🌇 เลิกงาน 17:00</label></div></div></div>
<div class="field"><label>5. เวลาที่สแกนนิ้วไม่ติด</label><input id="time" type="time" required></div>
<div class="field full"><label>6. แนบหลักฐานรูปภาพ</label><div class="upload"><input id="photo" type="file" accept="image/*" required><div class="hint">ถ่ายจากกล้องมือถือ หรือเลือกรูปจากเครื่อง</div><img id="preview" class="preview"></div></div>
<div class="field full"><label>7. หมายเหตุ/สาเหตุ</label><textarea id="note" rows="3" placeholder="เช่น เครื่องไม่อ่านนิ้ว, เครื่องขัดข้อง"></textarea></div>
<div class="field full"><button class="submit" type="submit">8. ส่งข้อมูล</button><div id="ok" class="ok">✓ ดำเนินการเสร็จสิ้น — บันทึกข้อมูลในเครื่องแล้ว</div></div>
</div></form>
<div class="records"><button class="manage" type="button" onclick="openManage()">จัดการรายการ</button><h3>รายการที่ส่งล่าสุด</h3><div id="records"></div></div></div></div>
<script>
const EMP=[["10010","จินดาวัลย์ มีกุล"],["10139","ขวัญใจ บุญเฟื่อง"],["10141","เกษร กองวงค์"],["10180","รุ่งระวี โสมูล"],["10349","เกษมสุข เชิดชู"],["10350","รัชนี ตรวจสมบัติ"],["10353","ขวัญเรือน แสนภูมิ"],["10365","สุพัตรา วิเชียรชาติ"],["10385","พงศ์พันธ์ เกิดทองดี"],["10440","นิภาพร ปิยาโยค"],["10442","ดาวเรือง วิระศรี"],["10452","อรสา บุญพิมพ์"],["10461","ขจร พิมพ์แมน"],["10470","มงคล องอาจ"],["10499","สมบูรณ์ บัวเข็ม"],["10506","อรุณี สอนวงษ์"],["10516","สานนท์ เดชโปรด"],["10518","ธวัช ทันใจ"],["10520","รัตติกรณ์ เครือจันทร์"],["10525","ธิญาดา ชาลีวัน"],["10526","ประเสริฐ แสงทอง"],["10527","ชูพงศ์ ทำดี"],["10543","ภูมิสิทธิ์ วัฒนะบวรพัฒน์"],["10553","วิทยา ยอดปา"],["10556","สกุณา กรรณิกา"],["10558","ปวีณา โมรา"],["10564","วัชราฤทธิ์ ยอดปา"],["10565","ลัดดาวัลย์ ทารินทร์"],["10583","อินทุอร สอนจันทร์"],["10593","วีรชาติ แซ่เต๋ง"],["10606","สุริยา ดำดี"],["10608","จักรพงษ์ หิรัญชัยศิลป์"],["10620","จันทร์สุดา บุญยอ"],["10627","นพดล ตี๊บบุญศรี"],["10630","อังคาร แสนทะวงค์"],["10635","รสรินทร์ ชำนาญพงศ์"],["10642","วิสุดา พิไชยรัตนจินดา"],["10647","พิชญ์สินี ไพศาลกูล"],["10648","อัจฉริยา จันทร์เยี่ยม"],["10656","บุศรินทร์ นาคประสาน"],["10660","จิรภิญญา กาศเมฆ"],["10661","นภาพรรณ สนใจ"],["10665","อภิญญา พงค์ปวน"],["10667","บังอร วณิชย์สุวรรณ์"],["10669","โกวิท รวมคำภา"],["10670","อัครพัชร์ กรงเต้น"],["10671","ทัศนะชัย อุนทุโร"],["10672","ภาณุภัค ศรีศิวาพรเจริญ"],["10675","ไชยา เรืองฤทธิ์"],["12453","จารุณี คุณาคม"],["30070","NAW TIN TIN HTWE TIN HTWE @ THUY"],["30072","MYOLATT"],["30078","NGWE HTIKE"],["30079","EI EI THET"],["30087","MYO THET"],["30113","THIN THIN AUNG"],["30115","AUNG TIN MYINT"],["30117","KHIN CHO OO"],["30149","ZAW ZAW AUNG"],["30171","MIN ZAW MIN"],["30221","TUN AUNG SHEIN"],["30249","KHAING THA ZIN PHYO"],["30251","KO KO KU KU"],["30257","TOE NAING"],["30265","HNIN THET"],["30268","KYAT PHA"],["30269","NINE NINE @ HNIN HNIN"],["30270","KHON THEIN SAUNG"],["30294","THUZAR"],["30313","AUNG TUN OO"],["30315","KYAW LIN"],["30318","SAW AHL HTO"],["30328","THEINGI WIN"],["30329","THI THI KHINE"],["30333","YE LIN TUN"],["30334","PHYU PHYU THEIN"],["30335","YE LIN HTIKE"],["30336","AYE PWINT PHYU"],["30337","AYE THANDAR ZAW"],["30338","CHIT HTWE"],["30340","SHAN MA LAY"],["30341","NAING PHYO KYAW"],["30342","NAW SAN THIDA NYEIN"],["30348","PHYO MIN WAI"],["30349","SOE MOE KYAW"],["30350","YE ZAW"],["30351","TIN MYO KO"],["30352","NWAY JUNG ZIN LATT"],["30353","SAI KYAW KYAW"],["30354","KYAW THURA SOE"],["30362","EA LA SOE"],["30366","NYI CHAY"],["30367","KIN WIN"],["30368","KAUNG PYAE PHYO"],["30369","มิน คานต์ ซอ"],["30370","ชิด มิน นาย"],["30371","NYI NYI"],["30372","SAI HTOO SAN"],["30373","CHO CHO AUNG"],["30374","พินยาดานา"],["30375","PHYO KO ZIN"],["30376","ยามินซูอ่าว"],["30377","มะโนมิวทุน"]];
const byId=Object.fromEntries(EMP), byName=Object.fromEntries(EMP.map(x=>[x[1],x[0]]));
ids.innerHTML=EMP.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('');
names.innerHTML=EMP.map(x=>'<option value="'+x[1]+'">'+x[0]+'</option>').join('');
eid.addEventListener('input',()=>{if(byId[eid.value]) ename.value=byId[eid.value]});
ename.addEventListener('input',()=>{if(byName[ename.value]) eid.value=byName[ename.value]});
date.value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
photo.addEventListener('change',()=>{const f=photo.files[0];if(f){preview.src=URL.createObjectURL(f);preview.style.display='inline-block'}});
let adminMode=false;
function loadRecords(){return JSON.parse(localStorage.getItem('fp_records')||'[]')}
function saveRecords(a){localStorage.setItem('fp_records',JSON.stringify(a))}
function openManage(){const code=prompt('กรอกรหัสสำหรับจัดการรายการ');if(code===null)return;if(code!=='303647'){alert('รหัสไม่ถูกต้อง');return}adminMode=true;render()}
function editRecord(i){const a=loadRecords(),r=a[i];if(!r)return;const d=prompt('วันที่ (YYYY-MM-DD)',r.date);if(d===null)return;const t=prompt('เวลา (HH:MM)',r.time);if(t===null)return;const n=prompt('หมายเหตุ/สาเหตุ',r.note||'');if(n===null)return;r.date=d.trim()||r.date;r.time=t.trim()||r.time;r.note=n;a[i]=r;saveRecords(a);render()}
function deleteRecord(i){const a=loadRecords(),r=a[i];if(!r)return;if(!confirm('ยืนยันลบรายการของ '+r.name+' ?'))return;a.splice(i,1);saveRecords(a);render()}
function render(){const a=loadRecords();const indexed=a.map((r,i)=>({r,i})).reverse().slice(0,20);records.innerHTML=indexed.length?indexed.map(x=>{const r=x.r;return '<div class="record"><b>'+r.employeeId+' — '+r.name+'</b><br>'+r.date+' • '+r.scan+' • '+r.time+(r.note?'<br>'+r.note:'')+(adminMode?'<div class="admin-actions"><button type="button" onclick="editRecord('+x.i+')">แก้ไข</button><button type="button" class="del" onclick="deleteRecord('+x.i+')">ลบ</button></div>':'')+'</div>'}).join(''):'<div class="hint">ยังไม่มีรายการในเครื่องนี้</div>'}
f.addEventListener('submit',e=>{e.preventDefault();if(!byId[eid.value]||byId[eid.value]!==ename.value){alert('กรุณาตรวจสอบรหัสและชื่อพนักงาน');return}const scan=document.querySelector('input[name=scan]:checked');if(!scan||!photo.files[0]){alert('กรุณากรอกข้อมูลและแนบรูปให้ครบ');return}const a=JSON.parse(localStorage.getItem('fp_records')||'[]');a.push({employeeId:eid.value,name:ename.value,date:date.value,scan:scan.value,time:time.value,note:note.value,createdAt:new Date().toISOString()});localStorage.setItem('fp_records',JSON.stringify(a));ok.style.display='block';render();setTimeout(()=>ok.style.display='none',3500);f.reset();date.value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);preview.style.display='none'});
render();
</script></body></html>
